    <path fill="#FFFFFF" d="M166,150 C177,150 188,172 194,186 C197,194 195,203 189,209 L175,221 C189,249 212,272 240,285 L253,272 C259,266 268,264 276,267 C290,273 313,283 313,294 C313,312 295,330 276,330 C198,330 135,267 135,189 C135,170 153,150 166,150 Z" />
